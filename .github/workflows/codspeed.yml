name: CodSpeed
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
  id-token: write
env:
  PYTHON_VERSION_DEFAULT: '3.10'
  UV_CACHE_DIR: /tmp/.uv-cache
jobs:
  codspeed:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
    - name: Install uv
      uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Install dependencies
      run: uv sync --all-extras --dev
    - name: Run benchmarks
      uses: CodSpeedHQ/action@0700edb451d0e9f2426f99bd6977027e550fb2a6
      with:
        upload-url: ${{ secrets.CODSPEED_FRANCOIS_DEV_UPLOAD_URL }}
        mode: simulation
        run: uv run pytest benchmarks/ --codspeed
